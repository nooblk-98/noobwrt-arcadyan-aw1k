name: Create Release from Jenkins Build

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: 'Build date (YYYY-MM-DD), leave empty to use today'
        required: false
        type: string
  repository_dispatch:
    types: [jenkins-build-complete]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build date
        id: date
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            DATE="${{ github.event.client_payload.build_date }}"
          else
            DATE="${{ inputs.build_date }}"
          fi
          if [ -z "$DATE" ]; then
            DATE=$(date -u +%Y-%m-%d)
          fi
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=v$DATE" >> $GITHUB_OUTPUT

      - name: Discover and fetch Jenkins artifacts
        id: fetch
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          BASE="https://jk.itsnooblk.com/job/noobwrt-builder/lastSuccessfulBuild"

          # Get artifact list from Jenkins API
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/api/json" -o jenkins_build.json

          # Extract relative paths for the files we need
          python3 - <<'EOF'
          import json, os
          with open('jenkins_build.json') as f:
              data = json.load(f)
          artifacts = {a['fileName']: a['relativePath'] for a in data.get('artifacts', [])}
          paths = {}
          for fname, rpath in artifacts.items():
              if fname == 'build.json':            paths['build_json'] = rpath
              elif fname == 'release.md':           paths['release_md'] = rpath
              elif fname.endswith('-sysupgrade.bin'): paths['bin'] = rpath
              elif fname.endswith('-factory.ubi'):    paths['ubi'] = rpath
          with open('artifact_paths.env', 'w') as f:
              for k, v in paths.items():
                  f.write(f'{k}={v}\n')
          print("Found:", paths)
          EOF

          # Load paths into env
          cat artifact_paths.env >> $GITHUB_ENV

          # Fetch build.json and release.md
          source artifact_paths.env
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${build_json}" -o build.json
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${release_md}" -o release_body.md

          echo "=== build.json ==="
          cat build.json

      - name: Parse OpenWrt versions from build.json
        id: versions
        run: |
          VERSIONS=$(python3 -c "
          import json
          with open('build.json') as f:
              data = json.load(f)
          if isinstance(data, list):
              builds = data
          elif isinstance(data, dict):
              builds = data.get('builds', data.get('versions', [data]))
          versions = []
          for b in builds:
              v = b.get('openwrt_version') or b.get('version') or b.get('openwrt')
              if v and v not in versions:
                  versions.append(v)
          print(','.join(versions))
          ")
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Detected versions: $VERSIONS"

      - name: Download firmware artifacts from Jenkins
        env:
          DATE: ${{ steps.date.outputs.date }}
          VERSIONS: ${{ steps.versions.outputs.versions }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          mkdir -p artifacts
          BASE="https://jk.itsnooblk.com/job/noobwrt-builder/lastSuccessfulBuild"

          # bin and ubi paths were loaded into env by previous step
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${bin}" -o "artifacts/sysupgrade.bin"

          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${ubi}" -o "artifacts/factory.ubi"

          # Rename per OpenWrt version
          IFS=',' read -ra VER_LIST <<< "$VERSIONS"
          for VER in "${VER_LIST[@]}"; do
            cp "artifacts/sysupgrade.bin" "artifacts/Arcadyan-AW1000-Pro-${VER}-${DATE}.bin"
            cp "artifacts/factory.ubi"    "artifacts/Arcadyan-AW1000-Pro-${VER}-${DATE}.ubi"
          done

          rm artifacts/sysupgrade.bin artifacts/factory.ubi
          ls -lh artifacts/

      - name: Build release body
        id: body
        env:
          TAG: ${{ steps.date.outputs.tag }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          BADGE="![Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/${TAG}/total?style=flat-square&label=release%20downloads&labelColor=24292f&color=238636)"
          echo "$BADGE" > release_full.md
          echo "" >> release_full.md
          cat release_body.md >> release_full.md

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.date.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.date.outputs.tag }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          gh release create "$TAG" \
            --title "NoobWRT ${TAG} for arcadyan-aw1000 5G" \
            --notes-file release_full.md \
            --latest \
            artifacts/*

      - name: Update existing release assets
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.date.outputs.tag }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          echo "Release $TAG already exists — uploading/replacing assets only"
          for f in artifacts/*; do
            gh release upload "$TAG" "$f" --clobber
          done
