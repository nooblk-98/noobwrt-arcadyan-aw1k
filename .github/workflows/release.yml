name: Create Release from Jenkins Build

on:
  workflow_dispatch:
    inputs:
      build_date:
        description: 'Build date (YYYY-MM-DD), leave empty to use today'
        required: false
        type: string
  repository_dispatch:
    types: [jenkins-build-complete]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set build date
        id: date
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            DATE="${{ github.event.client_payload.build_date }}"
          else
            DATE="${{ inputs.build_date }}"
          fi
          [ -z "$DATE" ] && DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=v$DATE" >> $GITHUB_OUTPUT

      - name: Fetch artifacts from Jenkins
        id: fetch
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          BASE="https://jk.itsnooblk.com/job/noobwrt-builder/lastSuccessfulBuild"
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/api/json" -o build.json

          python3 << 'EOF'
          import json
          with open('build.json') as f:
              data = json.load(f)
          paths = {}
          for a in data.get('artifacts', []):
              n = a['fileName']
              r = a['relativePath']
              if n == 'release.md':          paths['release_md'] = r
              if n.endswith('-sysupgrade.bin'): paths['bin'] = r
              if n.endswith('-factory.ubi'):    paths['ubi'] = r
          for k, v in paths.items():
              print(f"{k}={v}")
          EOF >> $GITHUB_ENV

      - name: Download release notes
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          BASE="https://jk.itsnooblk.com/job/noobwrt-builder/lastSuccessfulBuild"
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${release_md}" -o release.md

      - name: Download firmware
        env:
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          mkdir -p artifacts
          BASE="https://jk.itsnooblk.com/job/noobwrt-builder/lastSuccessfulBuild"
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${bin}" -o "artifacts/$(basename "$bin")"
          curl -fsSL --user "${JENKINS_USER}:${JENKINS_TOKEN}" \
            "${BASE}/artifact/${ubi}" -o "artifacts/$(basename "$ubi")"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.date.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            for f in artifacts/*; do gh release upload "$TAG" "$f" --clobber; done
          else
            gh release create "$TAG" \
              --title "NoobWRT ${TAG} for arcadyan-aw1000 5G" \
              --notes-file release.md \
              --latest \
              artifacts/*
          fi
