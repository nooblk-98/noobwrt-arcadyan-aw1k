# =============================================================================
# compile.conf — OpenWrt Compile Settings
# Controls OpenWrt version, router target, build options, and feeds.
# For packages, edit packages.conf instead.
# =============================================================================


# -----------------------------------------------------------------------------
# OpenWrt Source
# -----------------------------------------------------------------------------

# Branch / version to build from.
# Examples:
#   openwrt-25.12   (latest stable)
#   openwrt-24.10
#   main            (bleeding-edge snapshot)
OPENWRT_BRANCH="${OPENWRT_BRANCH:-openwrt-25.12}"

# Official OpenWrt git repo (usually no need to change)
OPENWRT_REPO="https://github.com/openwrt/openwrt.git"


# -----------------------------------------------------------------------------
# Router Target
# -----------------------------------------------------------------------------

# TARGET     — platform family  (e.g. qualcommax, ath79, ramips, x86, mediatek)
# SUBTARGET  — platform variant (e.g. ipq807x, generic, mt7622)
# PROFILE    — exact device ID  (check: make info | grep '^  [a-z]')

TARGET="qualcommax"
SUBTARGET="ipq807x"
PROFILE="arcadyan_aw1000"

# Common presets (uncomment to switch router):
#
# Arcadyan AW1000 (default)
# TARGET="qualcommax"  SUBTARGET="ipq807x"  PROFILE="arcadyan_aw1000"
#
# Xiaomi AX3600
# TARGET="qualcommax"  SUBTARGET="ipq807x"  PROFILE="xiaomi_ax3600"
#
# TP-Link Archer C7 v2
# TARGET="ath79"       SUBTARGET="generic"  PROFILE="tplink_archer-c7-v2"
#
# Raspberry Pi 4
# TARGET="bcm27xx"     SUBTARGET="bcm2711"  PROFILE="rpi-4"
#
# x86 / VM
# TARGET="x86"         SUBTARGET="64"       PROFILE="generic"


# -----------------------------------------------------------------------------
# Build Directory
# -----------------------------------------------------------------------------

# Where the OpenWrt source tree is checked out and compiled.
# Must be on a case-sensitive Linux filesystem (NOT /mnt/c/ in WSL).
# Override at runtime:  BUILD_DIR=/other/path bash build.sh
BUILD_DIR="${BUILD_DIR:-$HOME/openwrt-build-aw1000}"


# -----------------------------------------------------------------------------
# Build Options
# -----------------------------------------------------------------------------

# ccache — caches compiled objects so rebuilds take minutes instead of hours.
# Requires ccache to be installed: sudo apt install ccache
# "yes" to enable, "no" to disable.
CCACHE_ENABLED="yes"

# Where ccache stores its cache (separate from the build dir to survive clean builds).
CCACHE_DIR="${HOME}/.ccache-openwrt"

# Minimum free disk space required on BUILD_DIR's filesystem before starting (GB).
# A full OpenWrt build typically needs 15-20 GB.
MIN_DISK_GB=20

# Output directory — finished firmware images are copied here after each build.
# Each run creates a timestamped subfolder: output/YYYY-MM-DD_HH-MM/
# Default: <repo>/output   Override: OUTPUT_DIR=/some/other/path
# OUTPUT_DIR="/custom/path/to/output"

# Logs directory — per-run build logs saved as build-YYYY-MM-DD_HH-MM.log
# Default: <repo>/logs   Override: LOGS_DIR=/some/other/path
# LOGS_DIR="/custom/path/to/logs"


# -----------------------------------------------------------------------------
# Extra Feeds
# (added to feeds.conf.default if not already present)
# Format: "src-git <name> <url>;<branch>"
#         "src-link <name> <local/path>"
# -----------------------------------------------------------------------------

EXTRA_FEEDS=(
    "src-git noobwrt https://github.com/nooblk-98/noobwrt-custom-feeds.git;main"
)


# -----------------------------------------------------------------------------
# Pinned package versions
# build.sh patches feeds/packages/net/xray-core to this version after every
# feeds update, replacing whatever version the feed ships.
# Set XRAY_CORE_VERSION="" to stop pinning and use the feed's version.
# Hash = sha256 of https://codeload.github.com/XTLS/Xray-core/tar.gz/v<version>
# -----------------------------------------------------------------------------

XRAY_CORE_VERSION="26.9.9"
XRAY_CORE_HASH="efb871a981690688191433a76beef7afdab6750d53cc1775cf8e9e995730ef22"

# Go toolchain override. Xray >= 26.9.8 needs Go 1.27, but the pinned
# packages feed only ships Go 1.26. build.sh replaces feeds/packages/lang/golang
# with the version from this openwrt/packages commit ("golang: bump 1.27 to
# 1.27.1"), which makes Go 1.27 the default for ALL Go packages.
# Set GOLANG_FEED_COMMIT="" to keep the feed's own Go.
GOLANG_FEED_COMMIT="126203ce37adc023d5f567e4ced71a97a3d4167b"

# Tailscale — the pinned packages feed ships 1.98.3, which can't be built
# with Go 1.27: its bundled go-json-experiment/json clashes with Go 1.27's
# built-in encoding/json/v2 ("undefined: json.SkipFunc"). 1.104.1 targets
# Go 1.27.1. Needed while GOLANG_FEED_COMMIT makes Go 1.27 the default.
# Set TAILSCALE_VERSION="" to use the feed's version.
# Hash = sha256 of https://codeload.github.com/tailscale/tailscale/tar.gz/v<version>
TAILSCALE_VERSION="1.104.1"
TAILSCALE_HASH="bf868b2b1a46b9485d55bcda12c2d7573279ce4474bc6d607f42f1495db36ed8"

# PassWall2 — the noobwrt feed mirrors Openwrt-Passwall/openwrt-passwall2
# at whatever commit it last synced. Pin it to a tagged release
# ("<version>-<release>", e.g. "26.9.16-1" == PKG_VERSION 26.9.16 /
# PKG_RELEASE 1). build.sh downloads that tag and replaces
# luci-app-passwall2 with it after every feeds update.
# Set PASSWALL2_PIN_TAG="" to stop pinning and use the feed's version.
PASSWALL2_PIN_TAG="26.9.16-1"


# -----------------------------------------------------------------------------
# RJ11 phone port
#   "fxs"         — kmod-aw1000-fxs + fxsd + luci-app-fxs from the noobwrt feed
#                   (Perz3us/openwrt-aw1000-phone). build.sh converts the
#                   private si3226x_stock_tables.h into the SLIC patch file
#                   /etc/fxs/si3226x_patch.bin that fxsd needs.
#   "aw1000-rj11" — the old port from the package/aw1000-rj11 submodule
#   ""            — no phone port
# Both need the private tables ($RJ11_PRIVATE_DIR, mounted by CI); without
# them the phone packages are skipped.
# -----------------------------------------------------------------------------

PHONE_PORT="fxs"


# -----------------------------------------------------------------------------
# Extra kernel config lines written into .config before make defconfig
# -----------------------------------------------------------------------------

EXTRA_KCONFIG=(
    "CONFIG_SPI_QUP=y"
    "CONFIG_SPI_SPIDEV=y"

    # luci-app-qmodem's default "vendor-qmi-wwan" driver choice (kmod-qmi_wwan_q)
    # fails to link on ipq807x: its source auto-enables an NSS code path via
    # CONFIG_PINCTRL_IPQ807x, referencing rmnet_nss_callbacks. That symbol is
    # only defined by kmod-rmnet-nss ("nss-qmi-wwan" choice), which in turn
    # depends on kmod-qca-nss-drv — a vendor NSS driver package not present
    # in stock OpenWrt, so that choice can't build either. Use the generic
    # in-kernel kmod-usb-net-qmi-wwan driver instead (no vendor dependency).
    "CONFIG_PACKAGE_luci-app-qmodem_INCLUDE_generic-qmi-wwan=y"
)
