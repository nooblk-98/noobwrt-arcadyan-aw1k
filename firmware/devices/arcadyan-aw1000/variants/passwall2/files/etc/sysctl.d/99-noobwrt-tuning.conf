# NoobWRT network tuning — high-throughput cellular + VPN
# Larger socket buffers for gigabit-class throughput over high-latency links
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.optmem_max=65536
net.core.netdev_max_backlog=5000

net.ipv4.tcp_rmem=4096 262144 16777216
net.ipv4.tcp_wmem=4096 262144 16777216
net.ipv4.tcp_fastopen=3

# Cellular links often blackhole PMTU — probe instead of stalling
net.ipv4.tcp_mtu_probing=1

# BBR congestion control + fq_codel qdisc (needs kmod-tcp-bbr)
net.core.default_qdisc=fq_codel
net.ipv4.tcp_congestion_control=bbr
