# =============================================================================
# packages.conf — OpenWrt Package Selection
# Add or remove packages here. No need to touch build.sh or compile.conf.
#
# To ADD a package    : add its name under ADD_PKGS
# To REMOVE a package : add its name under REMOVE_PKGS
# To SKIP a package   : comment it out with #
# =============================================================================


# -----------------------------------------------------------------------------
# Packages — REMOVE
# These default OpenWrt packages are replaced by better alternatives below.
# -----------------------------------------------------------------------------

REMOVE_PKGS=(
    dnsmasq
    firewall
    firewall3
    iptables
    iptables-mod-tproxy
    iptables-mod-conntrack-extra
    iptables-mod-ipopt
    kmod-ipt-core
    kmod-ipt-nat
    iptables-nft
    https-dns-proxy       # use WAN DNS for Passwall node resolution
    luci-app-https-dns-proxy
    wpad-basic-mbedtls    # replaced by full wpad-mbedtls (adds 802.11s/k/v/r)
)


# -----------------------------------------------------------------------------
# Packages — ADD
# Comment out any line to drop a package from the build.
# -----------------------------------------------------------------------------

ADD_PKGS=(

    # --- LuCI Apps ---
    luci
    luci-app-cpufreq
    luci-app-frpc
    luci-app-hd-idle
    luci-app-mini-diskmanager
    luci-app-modemdata
    luci-app-nlbwmon
    luci-app-openvpn
    openvpn-openssl           # OpenVPN daemon + DCO kmod; luci-app-openvpn doesn't pull it (GH issue #33)
    luci-app-package-manager
    luci-app-qbittorrent
    luci-app-qmodem
    luci-app-qmodem-ttl
    luci-app-qmodem-voip      # QModem voice: pulls qmodem-voip + qmodem-sipd (SIP calling, AW1000 RG500Q-EA); needs the audio target feature (build.sh)
